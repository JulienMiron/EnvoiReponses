<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT-2902 — Envoi de réponses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ulaval-red: #E30513;
            --ulaval-red-dark: #B8040F;
            --ulaval-gold: #FFD100;
            --bg-light: #F7F8FA;
            --text-dark: #1A1A2E;
            --text-muted: #5A5A72;
            --card-bg: #FFFFFF;
            --border-light: #E8E8EF;
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, var(--ulaval-red) 0%, var(--ulaval-red-dark) 100%);
            color: #fff;
            padding: 40px 24px 36px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--ulaval-gold);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.88;
        }

        /* ── Main ── */
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            padding: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            margin-bottom: 18px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: var(--ulaval-red);
            box-shadow: 0 0 0 3px rgba(227, 5, 19, 0.12);
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--ulaval-red);
            box-shadow: 0 0 0 3px rgba(227, 5, 19, 0.12);
        }

        textarea + label {
            margin-top: 18px;
        }

        button {
            margin-top: 16px;
            padding: 12px 32px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--ulaval-red);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        button:hover {
            background: var(--ulaval-red-dark);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .statut {
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-muted);
            min-height: 20px;
        }

        .statut.succes { color: #1E8E3E; font-weight: 600; }
        .statut.erreur { color: var(--ulaval-red); font-weight: 600; }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: var(--ulaval-red);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>STT-2902</h1>
        <p>Envoi de réponses</p>
    </header>

    <main class="container">
        <div class="card">
            <form id="form-reponse">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom" placeholder="Prénom Nom" autocomplete="name" required>

                <label for="courriel">Courriel</label>
                <input type="email" id="courriel" name="courriel" placeholder="prenom.nom.1@ulaval.ca" autocomplete="email" required>

                <label for="reponse">Question 1</label>
                <textarea id="reponse" name="reponse" placeholder="Écrivez votre réponse ici…" required></textarea>

                <label for="reponse2">Question 2</label>
                <textarea id="reponse2" name="reponse2" placeholder="Écrivez votre réponse ici…" required></textarea>

                <button type="submit" id="btn-envoyer">Envoyer</button>
                <p id="statut" class="statut" role="status"></p>
            </form>
        </div>
    </main>

    <script>
        // URL du déploiement Google Apps Script (voir instructions de configuration)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoddDXQwhesi4ut6UJlB4fPZfUiaEsoAQxEA7nMaNrOoo94rxsKF4ep8He1Cn3Qk3L0A/exec';

        const form = document.getElementById('form-reponse');
        const bouton = document.getElementById('btn-envoyer');
        const statut = document.getElementById('statut');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            bouton.disabled = true;
            statut.textContent = 'Envoi en cours…';
            statut.className = 'statut';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        nom: form.nom.value,
                        courriel: form.courriel.value,
                        reponse: form.reponse.value,
                        reponse2: form.reponse2.value
                    })
                });
                statut.textContent = 'Réponse envoyée. Merci!';
                statut.className = 'statut succes';
                form.reset();
            } catch (err) {
                statut.textContent = "Erreur lors de l'envoi. Veuillez réessayer.";
                statut.className = 'statut erreur';
                } finally {
                bouton.disabled = false;
            }
        });
    </script>

    <footer class="footer">
        Pour toute question, contactez <a href="mailto:julien.miron@mat.ulaval.ca">julien.miron@mat.ulaval.ca</a>.
    </footer>

</body>
</html>
