<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT-2902 — Envoi de réponses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ulaval-red: #E30513;
            --ulaval-red-dark: #B8040F;
            --ulaval-gold: #FFD100;
            --bg-light: #F7F8FA;
            --text-dark: #1A1A2E;
            --text-muted: #5A5A72;
            --card-bg: #FFFFFF;
            --border-light: #E8E8EF;
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, var(--ulaval-red) 0%, var(--ulaval-red-dark) 100%);
            color: #fff;
            padding: 40px 24px 36px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--ulaval-gold);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.88;
        }

        /* ── Main ── */
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            padding: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--ulaval-red);
            box-shadow: 0 0 0 3px rgba(227, 5, 19, 0.12);
        }

        button {
            margin-top: 16px;
            padding: 12px 32px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--ulaval-red);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        button:hover {
            background: var(--ulaval-red-dark);
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: var(--ulaval-red);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>STT-2902</h1>
        <p>Envoi de réponses</p>
    </header>

    <main class="container">
        <div class="card">
            <form action="https://formsubmit.co/julien.miron@mat.ulaval.ca" method="POST">
                <!-- FormSubmit : options -->
                <input type="hidden" name="_subject" value="STT-2902 — Nouvelle réponse">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <label for="reponse">Votre réponse</label>
                <textarea id="reponse" name="reponse" placeholder="Écrivez votre réponse ici…" required></textarea>

                <button type="submit">Envoyer</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        Pour toute question, contactez <a href="mailto:julien.miron@mat.ulaval.ca">julien.miron@mat.ulaval.ca</a>.
    </footer>

</body>
</html>
